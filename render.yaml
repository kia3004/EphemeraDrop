services:
  - type: web
    name: ephemeradrop
    runtime: docker
    # Switch to starter for an always-on service; free instances sleep when idle.
    plan: free
    region: singapore
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: ephemeradrop-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: EPHEMERA_STORAGE_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: 'true'
      - key: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

databases:
  - name: ephemeradrop-db
    databaseName: ephemeradrop
    user: ephemeradrop
    plan: free
    region: singapore
