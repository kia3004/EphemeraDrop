services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      - app
    networks:
      - ephemeradrop

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment: &laravel-environment
      APP_NAME: EphemeraDrop
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: '${APP_KEY:?Set APP_KEY in the environment}'
      APP_URL: '${APP_URL:?Set APP_URL to the public HTTPS origin}'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: '${DB_DATABASE:-ephemeradrop}'
      DB_USERNAME: '${DB_USERNAME:-ephemeradrop}'
      DB_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in the environment}'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: private
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: warning
    volumes:
      - private-drops:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ephemeradrop

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-ephemeradrop}'
      MYSQL_USER: '${DB_USERNAME:-ephemeradrop}'
      MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in the environment}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ephemeradrop

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ephemeradrop

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: php artisan schedule:work
    environment: *laravel-environment
    volumes:
      - private-drops:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ephemeradrop

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: php artisan queue:work --tries=3
    environment: *laravel-environment
    volumes:
      - private-drops:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ephemeradrop

networks:
  ephemeradrop:
    driver: bridge

volumes:
  mysql-data:
  private-drops:
