expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
max_execution_time=120
max_input_time=60
upload_max_filesize=6M
post_max_size=6M
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=96
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
